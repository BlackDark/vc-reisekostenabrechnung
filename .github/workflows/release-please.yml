name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
      - name: Run CI on the release pull request
        if: steps.rp.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RP_PR: ${{ steps.rp.outputs.pr }}
        run: |
          branch=$(printf '%s' "$RP_PR" | jq -r .headBranchName)
          gh workflow run ci.yml --ref "$branch"
      - name: Publish the tag that release-please created
        if: steps.rp.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --ref "${{ steps.rp.outputs.tag_name }}"
