name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      # A pull request from a fork gets a read-only GITHUB_TOKEN, so the
      # SARIF upload cannot succeed and would fail the run for no finding.
      # The build and the analysis still run; only the upload is skipped.
      - name: Report a skipped upload
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true
        run: |
          echo "::notice::security-events: write is not grantable for a fork pull" \
            "request, so the CodeQL SARIF upload is skipped for this run."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true
