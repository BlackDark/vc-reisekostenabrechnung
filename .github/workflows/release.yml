name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish, for example v1.0.0. Empty uses the ref that triggered the run.
        required: false
        type: string
  push:
    tags: ["v*"]

# A manual run from main can publish an existing tag. The workflow file on that
# tag is not used; publish checks out inputs.tag (or github.ref_name).
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

# Manual dispatch and tag push can both name the same tag. Serialise them; a
# release is never cancelled once it started.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # 15 min of waiting for ci-ok plus the build and the push.
    timeout-minutes: 30
    permissions:
      contents: read
      checks: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Require a version tag
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*) ;;
            *)
              echo "RELEASE_TAG must look like v1.0.0, got: ${RELEASE_TAG}" >&2
              exit 1
              ;;
          esac
      - id: rev
        run: |
          {
            echo "short=$(git rev-parse --short=7 HEAD)"
            echo "full=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
      - name: Wait for a green CI run on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The tag points at a commit main CI already verified, so the release
          # re-runs nothing and publishes only what CI accepted. release-please
          # dispatches this workflow seconds after the release commit reaches
          # main, while ci-ok for that same commit still needs minutes, so poll
          # until the check run reports instead of reading an absent verdict.
          # Check runs are pruned after the retention window, so an old tag needs
          # a fresh CI run on its commit before it can be released here.
          sha="${{ steps.rev.outputs.full }}"
          short="${{ steps.rev.outputs.short }}"
          deadline=$((SECONDS + 900))
          reported=""
          while :; do
            read -r status conclusion <<<"$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name == "ci-ok")] | sort_by(.started_at) | last
                     | "\(.status // "none") \(.conclusion // "")"')"
            if [ -n "$status" ] && [ "$status $conclusion" != "$reported" ]; then
              reported="$status $conclusion"
              echo "ci-ok for $short is ${reported% }"
            fi
            if [ "$status" = completed ]; then
              if [ "$conclusion" = success ]; then
                echo "ci-ok passed for $short"
                break
              fi
              echo "ci-ok for $short concluded '${conclusion:-unknown}'" >&2
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "ci-ok for $sha is still not completed after 15 minutes" >&2
              exit 1
            fi
            sleep 15
          done
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter web
      - run: pnpm --filter web build
      - name: Embed the built SPA
        run: |
          rm -rf internal/webui/dist
          cp -r web/dist internal/webui/dist
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # The binaries carry the released version, which is why the release builds
      # them here instead of reusing the edge binaries. Compiling outside BuildKit
      # keeps the Go cache setup-go restored, and the image only has to copy.
      - name: Cross-compile the released version for both image platforms
        env:
          VERSION: ${{ env.RELEASE_TAG }}
          COMMIT: ${{ steps.rev.outputs.full }}
        run: |
          pids=()
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" OUT="prebuilt/$arch" ./scripts/build-binary.sh &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
      - name: Pack the binaries as one build context
        run: tar -C prebuilt -cf gobin.tar .
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/blackdark/vc-reisekostenabrechnung
          # latest=auto also emits latest on workflow_dispatch from the default
          # branch, which duplicates type=raw,value=latest.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}},value=${{ env.RELEASE_TAG }}
            type=raw,value=latest
            type=raw,value=sha-${{ steps.rev.outputs.short }}
      - id: tags
        name: Dedupe image tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "tags<<EOF"
            printf '%s\n' "$TAGS" | awk 'NF && !seen[$0]++'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build archive for size and scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=/tmp/image.oci.tar
          build-contexts: |
            gobin=./prebuilt
          provenance: false
          sbom: false
      - name: Image size
        run: python3 scripts/oci-size.py /tmp/image.oci.tar | tee image-size.txt
      - name: Load linux/amd64 from the OCI archive for Trivy
        run: |
          skopeo copy --override-arch amd64 --override-os linux \
            oci-archive:/tmp/image.oci.tar docker-daemon:vc-reisekosten:scan
          docker image inspect vc-reisekosten:scan >/dev/null
      - name: Trivy before push
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vc-reisekosten:scan
          format: table
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-contexts: |
            gobin=./prebuilt
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/blackdark/vc-reisekostenabrechnung@${DIGEST}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/blackdark/vc-reisekostenabrechnung
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/blackdark/vc-reisekostenabrechnung@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            sbom.spdx.json
            image-size.txt
          retention-days: 5

  notes:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-assets
      - name: Publish release notes and SBOM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          TAGS: ${{ needs.publish.outputs.tags }}
        run: |
          tag="${RELEASE_TAG}"
          repo="${GITHUB_REPOSITORY}"
          # No checkout in this job: gh runs git to find the repo unless --repo
          # is set. View by tag includes release-please drafts; GET
          # /releases/tags/{tag} does not (404 while the release is still a draft).
          gh release view "$tag" --repo "$repo" --json body --jq .body > /tmp/notes.md
          python3 - << 'PY'
          import os
          import pathlib
          text = pathlib.Path("/tmp/notes.md").read_text()
          if text.strip() == "null":
              text = ""
          marker = "## Container image"
          if marker in text:
              text = text[: text.index(marker)].rstrip() + "\n"
          sizes = pathlib.Path("image-size.txt").read_text().strip()
          seen = []
          for line in os.environ["TAGS"].splitlines():
              line = line.strip()
              if line and line not in seen:
                  seen.append(line)
          tags = "\n".join(seen)
          digest = os.environ["DIGEST"]
          image = "ghcr.io/blackdark/vc-reisekostenabrechnung"
          verify = (
              "cosign verify \\\n"
              "  --certificate-identity-regexp "
              "'https://github.com/BlackDark/vc-reisekostenabrechnung/\\.github/workflows/release.yml@.*' \\\n"
              "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\\n"
              f"  {image}@{digest}"
          )
          block = "\n".join([
              "",
              "## Container image",
              "",
              f"- Image: `{image}`",
              "- Tags:",
              "",
              "```",
              tags,
              "```",
              "",
              f"- Digest: `{digest}`",
              "- Platforms: linux/amd64, linux/arm64",
              "- Compressed size:",
              "",
              "```",
              sizes,
              "```",
              "",
              f"- Pull: `docker pull {image}@{digest}`",
              "- Verify:",
              "",
              "```",
              verify,
              "```",
              "",
          ])
          pathlib.Path("/tmp/notes.md").write_text(text.rstrip() + "\n" + block)
          PY
          gh release upload "$tag" sbom.spdx.json --repo "$repo" --clobber
          gh release edit "$tag" --repo "$repo" --notes-file /tmp/notes.md --draft=false
