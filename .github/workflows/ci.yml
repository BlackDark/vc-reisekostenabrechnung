name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The event keeps a manual run from cancelling a push run on the same ref.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  # A newer push to main supersedes the previous run.
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      go: ${{ steps.out.outputs.go }}
      web: ${{ steps.out.outputs.web }}
      image: ${{ steps.out.outputs.image }}
      toolchain: ${{ steps.out.outputs.toolchain }}
      backup: ${{ steps.out.outputs.backup }}
      ci: ${{ steps.out.outputs.ci }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A push diffs its own commit range, so the before commit must be
          # present; the shallow default holds HEAD only.
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'db/**'
              - 'api/**'
              - 'internal/**'
              - 'satztabellen/**'
              - 'docs/research/data/**'
              - 'tools/**'
              - '.golangci.yml'
            web:
              - 'web/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'biome.json'
              - 'scripts/check-i18n.mjs'
              - 'scripts/bundle-budget.mjs'
            image:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'db/**'
              - 'api/**'
              - 'internal/**'
              - 'satztabellen/**'
              - 'docs/research/data/**'
              - 'web/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'Dockerfile'
              - '.dockerignore'
              - 'assets/**'
              - 'e2e/**'
              - 'deploy/**'
              - 'scripts/**'
              - 'tools/**'
            toolchain:
              - 'mise.toml'
              - '.node-version'
              - 'go.mod'
              - 'package.json'
              - 'Dockerfile'
              - 'e2e/package.json'
              - 'scripts/mise-check.sh'
              - '.github/workflows/ci.yml'
            backup:
              - 'deploy/**'
              - 'scripts/compose-config.sh'
              - 'scripts/litestream-smoke.sh'
            ci:
              - '.github/workflows/**'
              - 'scripts/workflowperm/**'
              - 'scripts/ghrepo/**'
      - id: out
        run: |
          # Pull requests and pushes report what the diff touched, so a main push
          # that only changes documentation skips the compile, image and browser
          # jobs. A manual or release-called run has no diff to filter and runs
          # everything.
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.event_name }}" = "push" ]; then
            {
              echo "go=${{ steps.filter.outputs.go }}"
              echo "web=${{ steps.filter.outputs.web }}"
              echo "image=${{ steps.filter.outputs.image }}"
              echo "toolchain=${{ steps.filter.outputs.toolchain }}"
              echo "backup=${{ steps.filter.outputs.backup }}"
              echo "ci=${{ steps.filter.outputs.ci }}"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "go=true"
              echo "web=true"
              echo "image=true"
              echo "toolchain=true"
              echo "backup=true"
              echo "ci=true"
            } >> "$GITHUB_OUTPUT"
          fi

  go-lint:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  toolchain-parity:
    needs: changes
    if: needs.changes.outputs.toolchain == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No toolchain to install: the check only reads mise.toml and the files CI
      # reads its versions from, so local and CI can never disagree silently.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: mise.toml matches the CI toolchain
        run: bash scripts/mise-check.sh

  go-test:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Typst and poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          # Take the Typst binary out of the digest-pinned image the Dockerfile
          # already trusts, instead of downloading an unverified tarball.
          typst=ghcr.io/typst/typst:0.15.1@sha256:032e292249bcd378480cc7c142cfa324b63ef8aadeb88d7e7230320c4c9c422f
          docker create --name rk-typst "$typst"
          docker cp rk-typst:/bin/typst /tmp/typst
          docker rm rk-typst
          chmod +x /tmp/typst
          /tmp/typst --version
          echo "TYPST_PATH=/tmp/typst" >> "$GITHUB_ENV"
      - name: MinIO
        # minio/minio is gone from Docker Hub, and quay.io rejects anonymous pulls.
        run: |
          docker run -d --name rk-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46 server /data
          . scripts/lib/wait.sh
          wait_until 40 1 "the MinIO health endpoint" curl -sf http://127.0.0.1:9000/minio/health/live \
            || { docker logs rk-minio >&2 || true; exit 1; }
      - run: go test -race -shuffle=on -coverprofile=coverage.out ./...
        env:
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_BUCKET: rk-test
          S3_TEST_ACCESS_KEY: minioadmin
          S3_TEST_SECRET_KEY: minioadmin

  go-vuln:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: govulncheck
        with:
          path: ~/go/bin/govulncheck
          key: govulncheck-1.8.0-${{ runner.os }}
      - name: govulncheck
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          if [ "${{ steps.govulncheck.outputs.cache-hit }}" != "true" ]; then
            go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          fi
          govulncheck -version
          govulncheck ./...

  codegen:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.10.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/codegen-check.sh
      - run: bash scripts/postgres-probe.sh

  web:
    needs: changes
    # The Go binary embeds the built SPA, and the image is assembled from the Go
    # binaries, so both need this job's output even when only Go files changed.
    if: |
      needs.changes.outputs.web == 'true' || needs.changes.outputs.go == 'true'
      || needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.10.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm --filter web check
      - run: pnpm --filter web build
      - run: node scripts/check-i18n.mjs
      - run: node scripts/bundle-budget.mjs
      - name: Pack the built SPA for the Go build
        run: tar -C web -cf web-dist.tar dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web-dist.tar
          retention-days: 3

  # Compiles the server once per image platform and hands the binaries to the
  # image build as a build context. setup-go restores the Go build cache for the
  # same go.sum as the test jobs, so the compile is incremental instead of the
  # cold one BuildKit would pay for on every run.
  go-build:
    needs: [changes, web]
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: web-dist
      - name: Embed the built SPA
        run: |
          rm -rf internal/webui/dist
          tar -xf web-dist.tar -C internal/webui
      - name: Cross-compile for both image platforms
        env:
          VERSION: ci-${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: |
          pids=()
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" OUT="prebuilt/$arch" ./scripts/build-binary.sh &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
      - name: Pack the binaries as one build context
        run: tar -C prebuilt -cf gobin.tar .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gobin
          path: gobin.tar
          retention-days: 3

  image:
    needs: [changes, go-build]
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: gobin
      - name: Unpack the prebuilt binaries
        run: |
          mkdir -p prebuilt-go
          tar -xf gobin.tar -C prebuilt-go
      - run: bash scripts/compose-check.sh
      # One multi-platform build, and no compiler: the gobin context replaces the
      # Go stage with the binaries go-build already produced, so the arm64 image
      # costs a final COPY. The amd64 image comes out of the archive for the jobs
      # below, which is why nothing is built twice.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=/tmp/image.oci.tar
          build-contexts: |
            gobin=./prebuilt-go
          provenance: false
          sbom: false
      - run: python3 scripts/oci-size.py /tmp/image.oci.tar
      - name: Load linux/amd64 from the OCI archive
        run: |
          skopeo copy --override-arch amd64 --override-os linux \
            oci-archive:/tmp/image.oci.tar docker-daemon:vc-reisekosten:ci
          docker image inspect vc-reisekosten:ci >/dev/null
      - name: The image reports the commit it was built from
        run: |
          reported=$(docker run --rm vc-reisekosten:ci version)
          printf '%s\n' "$reported"
          test "$reported" = "ci-${{ github.run_id }} ${{ github.sha }}"
      - run: docker save vc-reisekosten:ci | zstd -T0 -o image-amd64.tar.zst
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-amd64
          path: image-amd64.tar.zst
          retention-days: 3

  smoke:
    needs: image
    if: needs.image.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: image-amd64
      - run: zstd -d image-amd64.tar.zst -c | docker load
      - run: bash scripts/smoke.sh vc-reisekosten:ci

  e2e:
    needs: image
    if: needs.image.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # Each shard gets its own runner, its own containers and its own SQLite
      # file, so shards cannot interfere. fail-fast keeps a single browser from
      # hiding the result of the other two.
      fail-fast: false
      matrix:
        project: [desktop, mobile, mobile-webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: image-amd64
      - run: zstd -d image-amd64.tar.zst -c | docker load
      - name: Start mock IdP and app
        run: bash scripts/e2e-up.sh
      - name: Playwright
        run: |
          docker run --rm --network host \
            -e CI=true \
            -e E2E_BASE_URL=http://127.0.0.1:8080 \
            -e E2E_PASSWORD=smoke-password-1 \
            -e E2E_OIDC=1 \
            -e E2E_WEBKIT=1 \
            -v "$PWD":/work -w /work \
            mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f \
            bash -lc 'npm install -g pnpm@12.10.1 \
              && pnpm install --frozen-lockfile --filter e2e \
              && pnpm --filter e2e exec playwright test --project=${{ matrix.project }}'
      - name: Container logs
        if: always()
        run: |
          docker logs rk-e2e || true
          docker logs rk-mock || true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-${{ matrix.project }}
          path: e2e/screenshots
          retention-days: 7
          if-no-files-found: ignore

  pdfa:
    needs: image
    if: needs.image.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Pinned by digest, the same way scripts/litestream-smoke.sh pins Litestream.
      VERAPDF_IMAGE: verapdf/cli:v1.30.2@sha256:d5ee329657cf9bc4b2400392dd54c7d0a0ce9980ff6fa2da5590eebeec007cdb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: image-amd64
      - run: zstd -d image-amd64.tar.zst -c | docker load
      - name: Sample exports
        run: |
          rm -rf out
          mkdir -p out
          chmod 777 out
          docker run --rm --user 65532:65532 \
            --read-only \
            --tmpfs /tmp:rw,nosuid,size=512m \
            -v "$PWD/out":/out \
            -e HOME=/tmp \
            -e TYPST_PATH=/usr/local/bin/typst \
            vc-reisekosten:ci export-sample --out /out
          docker run --rm --user 65532:65532 \
            -v "$PWD/out":/out:ro \
            vc-reisekosten:ci export-check --dir /out
      # One JVM boot per sample: the XML report carries the verdict
      # (<isCompliant>) and the exit code carries the same verdict.
      - name: Validate PDF/A-3b
        run: |
          mkdir -p reports
          fail=0
          for pdf in out/*/abrechnung.pdf; do
            name=$(basename "$(dirname "$pdf")")
            if ! docker run --rm --network none -v "$PWD/out:/out:ro" \
              "$VERAPDF_IMAGE" --flavour 3b --format xml "/out/$name/abrechnung.pdf" \
              > "reports/verapdf-${name}.xml"; then
              echo "veraPDF did not accept out/$name/abrechnung.pdf as PDF/A-3b" >&2
              fail=1
            fi
          done
          exit "$fail"
      - name: Reject a file that is not PDF/A-3b
        run: |
          printf '%s\n' '%PDF-1.1' '1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj' '2 0 obj<</Type/Pages/Count 0/Kids[]>>endobj' 'trailer<</Root 1 0 R>>' '%%EOF' > /tmp/broken.pdf
          set +e
          out=$(docker run --rm --network none -v /tmp/broken.pdf:/tmp/broken.pdf:ro \
            "$VERAPDF_IMAGE" --flavour 3b --format text /tmp/broken.pdf 2>&1)
          code=$?
          set -e
          printf '%s\n' "$out"
          if [ "$code" -eq 0 ] && printf '%s\n' "$out" | grep -q 'PASS'; then
            echo "veraPDF accepted a PDF that is not PDF/A-3b"
            exit 1
          fi
          echo "veraPDF rejected the broken PDF"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verapdf-reports
          path: reports
          retention-days: 7
          if-no-files-found: ignore

  backup:
    needs: changes
    if: needs.changes.outputs.backup == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compose config
        run: bash scripts/compose-config.sh
      - name: Litestream restore as UID 65532
        run: bash scripts/litestream-smoke.sh

  scan:
    needs: image
    if: needs.image.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: image-amd64
      - run: zstd -d image-amd64.tar.zst -c | docker load
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vc-reisekosten:ci
          format: sarif
          output: trivy-results.sarif
          scanners: vuln
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"
      - name: Report a skipped SARIF upload
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true
        run: |
          echo "::notice::security-events: write is not grantable for a fork pull" \
            "request, so the SARIF upload is skipped. The Trivy step above still ran" \
            "and still fails the job on a CRITICAL or HIGH finding."
      # Fork pull requests run with a read-only GITHUB_TOKEN, so the upload
      # cannot succeed there. The Trivy step above still gates the build.
      - if: >-
          always() && hashFiles('trivy-results.sarif') != ''
          && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true)
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  pr-titel:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Conventional commit title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" | grep -Eq '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-zA-Z0-9._/-]+\))?!?: .+'

  actionlint:
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: actionlint
        run: |
          curl -fsSL -o actionlint.tar.gz -L https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
          go test ./scripts/workflowperm ./scripts/ghrepo

  ci-ok:
    needs:
      [
        changes,
        go-lint,
        toolchain-parity,
        go-test,
        go-vuln,
        codegen,
        web,
        go-build,
        image,
        smoke,
        e2e,
        pdfa,
        backup,
        scan,
        pr-titel,
        actionlint,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Aggregate
        env:
          CHANGES: ${{ needs.changes.result }}
          GO_LINT: ${{ needs.go-lint.result }}
          TOOLCHAIN: ${{ needs.toolchain-parity.result }}
          GO_TEST: ${{ needs.go-test.result }}
          GO_VULN: ${{ needs.go-vuln.result }}
          CODEGEN: ${{ needs.codegen.result }}
          WEB: ${{ needs.web.result }}
          GO_BUILD: ${{ needs.go-build.result }}
          IMAGE: ${{ needs.image.result }}
          SMOKE: ${{ needs.smoke.result }}
          E2E: ${{ needs.e2e.result }}
          PDFA: ${{ needs.pdfa.result }}
          BACKUP: ${{ needs.backup.result }}
          SCAN: ${{ needs.scan.result }}
          TITLE: ${{ needs.pr-titel.result }}
          ACTIONLINT: ${{ needs.actionlint.result }}
        run: |
          python3 - << 'PY'
          import os, sys
          names = [
              "CHANGES", "GO_LINT", "TOOLCHAIN", "GO_TEST", "GO_VULN",
              "CODEGEN", "WEB", "GO_BUILD", "IMAGE", "SMOKE", "E2E", "PDFA", "BACKUP", "SCAN",
              "TITLE", "ACTIONLINT",
          ]
          bad = [name for name in names if os.environ[name] not in ("success", "skipped")]
          print({name: os.environ[name] for name in names})
          sys.exit(1 if bad else 0)
          PY

  publish-edge:
    needs: [ci-ok, go-build]
    # ci-ok aggregates jobs that a push skips (pr-titel is pull_request-only).
    # GitHub skips any job whose dependency chain holds a skipped job, even when
    # ci-ok itself succeeded, so the guard needs always(). always() also drops
    # the implicit success() of needs and lets a cancelled run through, hence the
    # explicit result and cancellation checks. go-build must have run as well: a
    # push that touched no image input has no binaries to publish. The event and
    # ref checks keep the channel off a manual run.
    if: |
      always() && !cancelled() && needs.ci-ok.result == 'success'
      && needs.go-build.result == 'success'
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: gobin
      - name: Unpack the prebuilt binaries
        run: |
          mkdir -p prebuilt-go
          tar -xf gobin.tar -C prebuilt-go
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/blackdark/vc-reisekostenabrechnung
          tags: |
            type=raw,value=edge
            type=sha,prefix=sha-,format=short
      # The binaries are the ones the tests above ran against, so the channel
      # publishes what CI verified. They carry the version go-build baked in.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-contexts: |
            gobin=./prebuilt-go
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the edge image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/blackdark/vc-reisekostenabrechnung@${DIGEST}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/blackdark/vc-reisekostenabrechnung
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      # The channel counts as published only when the tag resolves to the index
      # this run built and signed.
      - name: The edge tag points at this build
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          got=$(docker buildx imagetools inspect --raw ghcr.io/blackdark/vc-reisekostenabrechnung:edge | sha256sum | cut -d' ' -f1)
          test "sha256:$got" = "$DIGEST" || { echo "edge is sha256:$got, expected $DIGEST"; exit 1; }