name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      caller:
        description: Concurrency prefix so a caller does not deadlock with this workflow
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.caller || github.event_name }}-${{ github.ref }}
  # A newer push to main supersedes the previous run; a called workflow never
  # cancels its caller.
  cancel-in-progress: ${{ inputs.caller == '' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      go: ${{ steps.out.outputs.go }}
      web: ${{ steps.out.outputs.web }}
      image: ${{ steps.out.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'db/**'
              - 'api/**'
              - 'internal/**'
              - 'satztabellen/**'
              - 'docs/research/data/**'
              - '.golangci.yml'
            web:
              - 'web/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'biome.json'
              - 'scripts/check-i18n.mjs'
              - 'scripts/bundle-budget.mjs'
            image:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'db/**'
              - 'api/**'
              - 'internal/**'
              - 'satztabellen/**'
              - 'docs/research/data/**'
              - 'web/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'Dockerfile'
              - '.dockerignore'
              - 'assets/**'
              - 'e2e/**'
              - 'deploy/**'
              - 'scripts/**'
      - id: out
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            {
              echo "go=${{ steps.filter.outputs.go }}"
              echo "web=${{ steps.filter.outputs.web }}"
              echo "image=${{ steps.filter.outputs.image }}"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "go=true"
              echo "web=true"
              echo "image=true"
            } >> "$GITHUB_OUTPUT"
          fi

  go-lint:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  go-test:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Typst and poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          # Take the Typst binary out of the digest-pinned image the Dockerfile
          # already trusts, instead of downloading an unverified tarball.
          typst=ghcr.io/typst/typst:0.15.1@sha256:032e292249bcd378480cc7c142cfa324b63ef8aadeb88d7e7230320c4c9c422f
          docker create --name rk-typst "$typst"
          docker cp rk-typst:/bin/typst /tmp/typst
          docker rm rk-typst
          chmod +x /tmp/typst
          /tmp/typst --version
          echo "TYPST_PATH=/tmp/typst" >> "$GITHUB_ENV"
      - name: MinIO
        # minio/minio is gone from Docker Hub, and quay.io rejects anonymous pulls.
        run: |
          docker run -d --name rk-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46 server /data
          attempt=0
          while [ "$attempt" -lt 40 ]; do
            if curl -sf http://127.0.0.1:9000/minio/health/live; then
              exit 0
            fi
            attempt=$((attempt + 1))
            sleep 1
          done
          docker logs rk-minio >&2 || true
          exit 1
      - run: go test -race -shuffle=on -coverprofile=coverage.out ./...
        env:
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_BUCKET: rk-test
          S3_TEST_ACCESS_KEY: minioadmin
          S3_TEST_SECRET_KEY: minioadmin

  go-vuln:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: govulncheck
        with:
          path: ~/go/bin/govulncheck
          key: govulncheck-1.8.0-${{ runner.os }}
      - name: govulncheck
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          if [ "${{ steps.govulncheck.outputs.cache-hit }}" != "true" ]; then
            go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          fi
          govulncheck -version
          govulncheck ./...

  go-crossbuild:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -tags nodynamic -o /tmp/reisekosten-arm64 ./cmd/reisekosten

  codegen:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.10.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/codegen-check.sh
      - run: bash scripts/postgres-probe.sh

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.10.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm --filter web check
      - run: pnpm --filter web build
      - run: node scripts/check-i18n.mjs
      - run: node scripts/bundle-budget.mjs

  image:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        id: buildx
        with:
          driver: docker-container
      # type=gha does not carry the contents of RUN --mount=type=cache, so the
      # dance is what makes the pnpm store and the Go caches survive a run.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-mount
        with:
          path: cache-mount
          key: buildkit-${{ hashFiles('Dockerfile', 'pnpm-lock.yaml', 'go.sum') }}
          restore-keys: |
            buildkit-${{ hashFiles('pnpm-lock.yaml', 'go.sum') }}-
            buildkit-
      - uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          # Auto-discovery maps every RUN --mount=type=cache id onto cache-mount/<id>,
          # which is exactly what the actions/cache path above stores.
          cache-dir: cache-mount
          skip-extraction: ${{ steps.cache-mount.outputs.cache-hit }}
      - run: bash scripts/compose-check.sh
      # One multi-platform build. The amd64 image is extracted from the OCI
      # archive for the jobs below, so nothing is compiled twice.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=/tmp/image.oci.tar
          build-args: |
            VERSION=ci-${{ github.run_id }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
      - run: python3 scripts/oci-size.py /tmp/image.oci.tar
      - name: Load linux/amd64 from the OCI archive
        run: |
          skopeo copy --override-arch amd64 --override-os linux \
            oci-archive:/tmp/image.oci.tar docker-daemon:vc-reisekosten:ci
          docker image inspect vc-reisekosten:ci >/dev/null
      - name: The image reports the commit it was built from
        run: |
          reported=$(docker run --rm vc-reisekosten:ci version)
          printf '%s\n' "$reported"
          test "$reported" = "ci-${{ github.run_id }} ${{ github.sha }}"
      - run: docker save vc-reisekosten:ci | zstd -T0 -o image-amd64.tar.zst
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-amd64
          path: image-amd64.tar.zst
          retention-days: 3

  smoke:
    needs: image
    if: needs.image.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: image-amd64
      - run: zstd -d image-amd64.tar.zst -c | docker load
      - run: bash scripts/smoke.sh vc-reisekosten:ci

  e2e:
    needs: image
    if: needs.image.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # Each shard gets its own runner, its own containers and its own SQLite
      # file, so shards cannot interfere. fail-fast keeps a single browser from
      # hiding the result of the other two.
      fail-fast: false
      matrix:
        project: [desktop, mobile, mobile-webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: image-amd64
      - run: zstd -d image-amd64.tar.zst -c | docker load
      - name: Start mock IdP and app
        run: bash scripts/e2e-up.sh
      - name: Playwright
        run: |
          docker run --rm --network host \
            -e CI=true \
            -e E2E_BASE_URL=http://127.0.0.1:8080 \
            -e E2E_PASSWORD=smoke-password-1 \
            -e E2E_OIDC=1 \
            -e E2E_WEBKIT=1 \
            -v "$PWD":/work -w /work \
            mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f \
            bash -lc 'npm install -g pnpm@12.10.1 \
              && pnpm install --frozen-lockfile --filter e2e \
              && pnpm --filter e2e exec playwright test --project=${{ matrix.project }}'
      - name: Container logs
        if: always()
        run: |
          docker logs rk-e2e || true
          docker logs rk-mock || true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-${{ matrix.project }}
          path: e2e/screenshots
          retention-days: 7
          if-no-files-found: ignore

  pdfa:
    needs: image
    if: needs.image.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Pinned by digest, the same way scripts/litestream-smoke.sh pins Litestream.
      VERAPDF_IMAGE: verapdf/cli:v1.30.2@sha256:d5ee329657cf9bc4b2400392dd54c7d0a0ce9980ff6fa2da5590eebeec007cdb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: image-amd64
      - run: zstd -d image-amd64.tar.zst -c | docker load
      - name: Sample exports
        run: |
          rm -rf out
          mkdir -p out
          chmod 777 out
          docker run --rm --user 65532:65532 \
            --read-only \
            --tmpfs /tmp:rw,nosuid,size=512m \
            -v "$PWD/out":/out \
            -e HOME=/tmp \
            -e TYPST_PATH=/usr/local/bin/typst \
            vc-reisekosten:ci export-sample --out /out
          docker run --rm --user 65532:65532 \
            -v "$PWD/out":/out:ro \
            vc-reisekosten:ci export-check --dir /out
      # One JVM boot per sample: the XML report carries the verdict
      # (<isCompliant>) and the exit code carries the same verdict.
      - name: Validate PDF/A-3b
        run: |
          mkdir -p reports
          fail=0
          for pdf in out/*/abrechnung.pdf; do
            name=$(basename "$(dirname "$pdf")")
            if ! docker run --rm --network none -v "$PWD/out:/out:ro" \
              "$VERAPDF_IMAGE" --flavour 3b --format xml "/out/$name/abrechnung.pdf" \
              > "reports/verapdf-${name}.xml"; then
              echo "veraPDF did not accept out/$name/abrechnung.pdf as PDF/A-3b" >&2
              fail=1
            fi
          done
          exit "$fail"
      - name: Reject a file that is not PDF/A-3b
        run: |
          printf '%s\n' '%PDF-1.1' '1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj' '2 0 obj<</Type/Pages/Count 0/Kids[]>>endobj' 'trailer<</Root 1 0 R>>' '%%EOF' > /tmp/broken.pdf
          set +e
          out=$(docker run --rm --network none -v /tmp/broken.pdf:/tmp/broken.pdf:ro \
            "$VERAPDF_IMAGE" --flavour 3b --format text /tmp/broken.pdf 2>&1)
          code=$?
          set -e
          printf '%s\n' "$out"
          if [ "$code" -eq 0 ] && printf '%s\n' "$out" | grep -q 'PASS'; then
            echo "veraPDF accepted a PDF that is not PDF/A-3b"
            exit 1
          fi
          echo "veraPDF rejected the broken PDF"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verapdf-reports
          path: reports
          retention-days: 7
          if-no-files-found: ignore

  backup:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compose config
        run: bash scripts/compose-config.sh
      - name: Litestream restore as UID 65532
        run: bash scripts/litestream-smoke.sh

  scan:
    needs: image
    if: needs.image.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: image-amd64
      - run: zstd -d image-amd64.tar.zst -c | docker load
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vc-reisekosten:ci
          format: sarif
          output: trivy-results.sarif
          scanners: vuln
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"
      - name: Report a skipped SARIF upload
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true
        run: |
          echo "::notice::security-events: write is not grantable for a fork pull" \
            "request, so the SARIF upload is skipped. The Trivy step above still ran" \
            "and still fails the job on a CRITICAL or HIGH finding."
      # Fork pull requests run with a read-only GITHUB_TOKEN, so the upload
      # cannot succeed there. The Trivy step above still gates the build.
      - if: >-
          always() && hashFiles('trivy-results.sarif') != ''
          && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true)
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  pr-titel:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Conventional commit title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" | grep -Eq '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-zA-Z0-9._/-]+\))?!?: .+'

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: actionlint
        run: |
          curl -fsSL -o actionlint.tar.gz -L https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
          go test ./scripts/workflowperm ./scripts/ghrepo

  ci-ok:
    needs:
      [
        changes,
        go-lint,
        go-test,
        go-vuln,
        go-crossbuild,
        codegen,
        web,
        image,
        smoke,
        e2e,
        pdfa,
        backup,
        scan,
        pr-titel,
        actionlint,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Aggregate
        env:
          CHANGES: ${{ needs.changes.result }}
          GO_LINT: ${{ needs.go-lint.result }}
          GO_TEST: ${{ needs.go-test.result }}
          GO_VULN: ${{ needs.go-vuln.result }}
          GO_CROSSBUILD: ${{ needs.go-crossbuild.result }}
          CODEGEN: ${{ needs.codegen.result }}
          WEB: ${{ needs.web.result }}
          IMAGE: ${{ needs.image.result }}
          SMOKE: ${{ needs.smoke.result }}
          E2E: ${{ needs.e2e.result }}
          PDFA: ${{ needs.pdfa.result }}
          BACKUP: ${{ needs.backup.result }}
          SCAN: ${{ needs.scan.result }}
          TITLE: ${{ needs.pr-titel.result }}
          ACTIONLINT: ${{ needs.actionlint.result }}
        run: |
          python3 - << 'PY'
          import os, sys
          names = [
              "CHANGES", "GO_LINT", "GO_TEST", "GO_VULN", "GO_CROSSBUILD", "CODEGEN",
              "WEB", "IMAGE", "SMOKE", "E2E", "PDFA", "BACKUP", "SCAN", "TITLE",
              "ACTIONLINT",
          ]
          bad = [name for name in names if os.environ[name] not in ("success", "skipped")]
          print({name: os.environ[name] for name in names})
          sys.exit(1 if bad else 0)
          PY

  publish-edge:
    needs: ci-ok
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
