openapi: 3.1.0
info:
  title: Reisekostenabrechnung API
  version: 0.7.0
  description: Abrechnungen, Exporte, Reisen, Pauschalen, Ausgaben, Belege, optionales KI-Auslesen, Fremdwährung, Bewirtung, Vorschüsse, Fahrten, Vorlagen, Arbeitgeber, Tätigkeitsstätten, and Satztabellen.
servers:
  - url: /
paths:
  /api/v1/auth/config:
    get:
      operationId: getAuthConfig
      tags: [auth]
      summary: Active login methods
      responses:
        "200":
          description: Configuration the login page needs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthConfig"
  /api/v1/auth/login:
    post:
      operationId: postAuthLogin
      tags: [auth]
      summary: Password login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nutzer"
        "401":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /api/v1/auth/logout:
    post:
      operationId: postAuthLogout
      tags: [auth]
      summary: End the current session
      responses:
        "204":
          description: Signed out
  /api/v1/auth/oidc/start:
    get:
      operationId: getAuthOidcStart
      tags: [auth]
      summary: Start the OIDC authorization code flow with PKCE
      responses:
        "302":
          description: Redirect to the identity provider
          headers:
            Location:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Problem"
  /api/v1/auth/oidc/callback:
    get:
      operationId: getAuthOidcCallback
      tags: [auth]
      summary: OIDC redirect URI
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        "302":
          description: Redirect back to the app
          headers:
            Location:
              schema:
                type: string
  /api/v1/auth/setup:
    post:
      operationId: postAuthSetup
      tags: [auth]
      summary: Create the first Admin with the setup token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201":
          description: Admin created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nutzer"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /api/v1/auth/me:
    get:
      operationId: getAuthMe
      tags: [auth]
      summary: Current Nutzer
      responses:
        "200":
          description: Current Nutzer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nutzer"
        "401":
          $ref: "#/components/responses/Problem"
  /api/v1/auth/passwort:
    put:
      operationId: putAuthPasswort
      tags: [auth]
      summary: Change the current Nutzer password
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswortRequest"
      responses:
        "204":
          description: Password updated
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
  /api/v1/me:
    get:
      operationId: getMe
      tags: [profil]
      summary: Profile of the current Nutzer
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nutzer"
        "401":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: patchMe
      tags: [profil]
      summary: Update the profile
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfilPatch"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nutzer"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
  /api/v1/me/sessions:
    get:
      operationId: getMeSessions
      tags: [profil]
      summary: Active sessions of the current Nutzer
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Problem"
  /api/v1/me/sessions/{id}:
    delete:
      operationId: deleteMeSession
      tags: [profil]
      summary: End one session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Session ended
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/admin/nutzer:
    get:
      operationId: getAdminNutzer
      tags: [admin]
      summary: List Nutzer
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Nutzer page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NutzerListe"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    post:
      operationId: postAdminNutzer
      tags: [admin]
      summary: Create a Nutzer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NutzerCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nutzer"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /api/v1/admin/nutzer/{id}:
    patch:
      operationId: patchAdminNutzer
      tags: [admin]
      summary: Update a Nutzer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NutzerAdminPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nutzer"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
  /api/v1/arbeitgeber:
    get:
      operationId: getArbeitgeber
      tags: [arbeitgeber]
      summary: List the current Nutzer's Arbeitgeber
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Arbeitgeber page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArbeitgeberListe"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      operationId: postArbeitgeber
      tags: [arbeitgeber]
      summary: Create an Arbeitgeber
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArbeitgeberWrite"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Arbeitgeber"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/arbeitgeber/{id}:
    get:
      operationId: getArbeitgeberById
      tags: [arbeitgeber]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Arbeitgeber
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Arbeitgeber"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: patchArbeitgeber
      tags: [arbeitgeber]
      summary: Update an Arbeitgeber
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArbeitgeberPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Arbeitgeber"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
  /api/v1/arbeitgeber/{id}/logo:
    get:
      operationId: getArbeitgeberLogo
      tags: [arbeitgeber]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Logo image
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: postArbeitgeberLogo
      tags: [arbeitgeber]
      summary: Upload a PNG or JPEG logo
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [datei]
              properties:
                datei:
                  type: string
                  format: binary
      responses:
        "200":
          description: Arbeitgeber with the new logo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Arbeitgeber"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
  /api/v1/taetigkeitsstaetten:
    get:
      operationId: getTaetigkeitsstaetten
      tags: [taetigkeitsstaetten]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Tätigkeitsstätten page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaetigkeitsstaetteListe"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      operationId: postTaetigkeitsstaette
      tags: [taetigkeitsstaetten]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaetigkeitsstaetteWrite"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Taetigkeitsstaette"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/taetigkeitsstaetten/{id}:
    get:
      operationId: getTaetigkeitsstaette
      tags: [taetigkeitsstaetten]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Tätigkeitsstätte
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Taetigkeitsstaette"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: patchTaetigkeitsstaette
      tags: [taetigkeitsstaetten]
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaetigkeitsstaetteWrite"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Taetigkeitsstaette"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteTaetigkeitsstaette
      tags: [taetigkeitsstaetten]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/satztabellen:
    get:
      operationId: getSatztabellen
      tags: [satztabellen]
      responses:
        "200":
          description: Years
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SatztabelleListe"
        "401":
          $ref: "#/components/responses/Problem"
  /api/v1/satztabellen/{jahr}:
    get:
      operationId: getSatztabelle
      tags: [satztabellen]
      parameters:
        - $ref: "#/components/parameters/Jahr"
      responses:
        "200":
          description: Year with effective domestic rates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Satztabelle"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: patchSatztabelle
      tags: [satztabellen]
      summary: Admin override of one rate
      parameters:
        - $ref: "#/components/parameters/Jahr"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SatzOverrideRequest"
      responses:
        "200":
          description: Year after the override
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Satztabelle"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
  /api/v1/satztabellen/{jahr}/auslandssaetze:
    get:
      operationId: getAuslandssaetze
      tags: [satztabellen]
      parameters:
        - $ref: "#/components/parameters/Jahr"
        - name: q
          in: query
          schema:
            type: string
        - name: land_iso
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Abroad rates, effective values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuslandssatzListe"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/satztabellen/{jahr}/overrides:
    get:
      operationId: getSatzOverrides
      tags: [satztabellen]
      parameters:
        - $ref: "#/components/parameters/Jahr"
      responses:
        "200":
          description: Override log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SatzOverrideListe"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/satztabellen/{jahr}/import:
    post:
      operationId: postSatztabelleImport
      tags: [satztabellen]
      parameters:
        - $ref: "#/components/parameters/Jahr"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [datei]
              properties:
                datei:
                  type: string
                  format: binary
      responses:
        "200":
          description: Imported as Entwurf
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SatztabelleImport"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/satztabellen/{jahr}/aktivieren:
    post:
      operationId: postSatztabelleAktivieren
      tags: [satztabellen]
      parameters:
        - $ref: "#/components/parameters/Jahr"
      responses:
        "200":
          description: Year is aktiv
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Satztabelle"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/admin/nutzer/{id}/identitaeten:
    get:
      operationId: getAdminIdentitaeten
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Linked identities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentitaetListe"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: postAdminIdentitaet
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentitaetWrite"
      responses:
        "201":
          description: Linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identitaet"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteAdminIdentitaet
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: identitaet_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Unlinked
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/admin/protokoll:
    get:
      operationId: getAdminProtokoll
      tags: [admin]
      parameters:
        - name: objekt_typ
          in: query
          schema:
            type: string
        - name: objekt_id
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Admin audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtokollListe"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /api/v1/reisen:
    get:
      operationId: getReisen
      tags: [reisen]
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: von
          in: query
          schema:
            type: string
        - name: bis
          in: query
          schema:
            type: string
        - name: arbeitgeber_id
          in: query
          schema:
            type: string
        - name: projekt
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Reisen of the current Nutzer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReiseListe"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      operationId: postReise
      tags: [reisen]
      summary: Create a Reise with Ortswechsel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReiseWrite"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reise"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/reisen/{id}:
    get:
      operationId: getReise
      tags: [reisen]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Reise
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reise"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: patchReise
      tags: [reisen]
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReiseWrite"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reise"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteReise
      tags: [reisen]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
