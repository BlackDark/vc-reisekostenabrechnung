components:
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    Jahr:
      name: jahr
      in: path
      required: true
      schema:
        type: integer
        minimum: 2000
        maximum: 2100
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
  responses:
    Problem:
      description: RFC 9457 problem
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      required: [pointer, code]
      properties:
        pointer:
          type: string
        code:
          type: string
    AuthConfig:
      type: object
      required: [passwort, oidc, header, setup_erforderlich, default_locale, ai_aktiviert, ai_basis_url]
      properties:
        passwort:
          type: boolean
        oidc:
          type: boolean
        oidc_button_label:
          type: string
        oidc_auto_redirect:
          type: boolean
        header:
          type: boolean
        header_logout_url:
          type: string
        setup_erforderlich:
          type: boolean
        default_locale:
          type: string
          enum: [de, en]
        ai_aktiviert:
          type: boolean
        ai_basis_url:
          type: string
          description: Public base URL of the KI endpoint. Empty when KI is off. Never includes the API key.
    LoginRequest:
      type: object
      required: [benutzername, passwort]
      properties:
        benutzername:
          type: string
        passwort:
          type: string
    SetupRequest:
      type: object
      required: [token, benutzername, passwort, anzeigename]
      properties:
        token:
          type: string
        benutzername:
          type: string
        passwort:
          type: string
        anzeigename:
          type: string
        email:
          type: string
    PasswortRequest:
      type: object
      required: [neues_passwort]
      properties:
        aktuelles_passwort:
          type: string
        neues_passwort:
          type: string
    ProfilPatch:
      type: object
      properties:
        anzeigename:
          type: string
        sprache:
          type: string
          enum: [de, en]
        personalnummer:
          type: string
        ki_erlaubt:
          type: boolean
    Nutzer:
      type: object
      required: [id, anzeigename, benutzername, ist_admin, sprache, ki_erlaubt, aktiv, version]
      properties:
        id:
          type: string
        anzeigename:
          type: string
        email:
          type: string
        benutzername:
          type: string
        ist_admin:
          type: boolean
        sprache:
          type: string
        personalnummer:
          type: string
        ki_erlaubt:
          type: boolean
        aktiv:
          type: boolean
        version:
          type: integer
          format: int64
    NutzerListe:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Nutzer"
        next_cursor:
          type: string
    NutzerCreate:
      type: object
      required: [anzeigename, benutzername, passwort]
      properties:
        anzeigename:
          type: string
        benutzername:
          type: string
        email:
          type: string
        passwort:
          type: string
        ist_admin:
          type: boolean
        sprache:
          type: string
          enum: [de, en]
    NutzerAdminPatch:
      type: object
      properties:
        aktiv:
          type: boolean
        ist_admin_lokal:
          type: boolean
        passwort:
          type: string
    Session:
      type: object
      required: [id, letzte_nutzung, aktuell]
      properties:
        id:
          type: string
        user_agent:
          type: string
        ip:
          type: string
        letzte_nutzung:
          type: string
          format: date-time
        aktuell:
          type: boolean
    Arbeitgeber:
      type: object
      required: [id, name, anschrift, ist_standard, konstellation, abrechnungsnummer_praefix, archiviert, version]
      properties:
        id:
          type: string
        name:
          type: string
        anschrift:
          type: string
        ust_id:
          type: string
        steuernummer:
          type: string
        logo_datei_id:
          type: string
        ist_standard:
          type: boolean
        konstellation:
          type: string
          enum: [arbeitgebererstattung, werbungskosten, betriebsausgaben]
        abrechnungsnummer_praefix:
          type: string
        archiviert:
          type: boolean
        version:
          type: integer
          format: int64
    ArbeitgeberListe:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Arbeitgeber"
        next_cursor:
          type: string
    ArbeitgeberWrite:
      type: object
      required: [name, anschrift]
      properties:
        name:
          type: string
        anschrift:
          type: string
        ust_id:
          type: string
        steuernummer:
