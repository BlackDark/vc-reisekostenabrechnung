# docker compose -f docker-compose.yml -f docker-compose.backup.yml up -d
services:
  litestream:
    image: litestream/litestream:0.5.17-scratch@sha256:f757c70d070ac278d45b8847d31a54ab2de24de5e77b09018c642eca263e3967
    restart: unless-stopped
    command: ["replicate"]
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    tmpfs: ["/tmp:rw,nosuid,size=64m"]
    environment:
      HOME: /tmp
    # Die Zugangsdaten zur Replica stehen in ./secrets/litestream.yml (siehe
    # docs/installation.md), nicht in der Umgebung: `docker inspect` und
    # /proc/<pid>/environ zeigen sonst jeden Wert.
    volumes: ["data:/data", "./secrets/litestream.yml:/etc/litestream.yml:ro"]
